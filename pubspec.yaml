# =============================================================================
# pubspec.yaml ở ROOT của monorepo
#
# File này đóng 2 vai trò cùng lúc:
#   1. Định nghĩa Pub Workspace (key `workspace:`): cho Dart biết những package
#      nào thuộc cùng một repo. Dart sẽ resolve dependency MỘT LẦN cho tất cả,
#      sinh ra MỘT file pubspec.lock duy nhất ở đây.
#   2. Cấu hình melos (key `melos:`): script dùng chung, bộ lọc package...
#      Từ melos 7.x không còn file melos.yaml nữa, mọi thứ nằm ở đây.
#
# Tại sao root KHÔNG phải là một app?
#   Melos khuyến nghị root chỉ chứa cấu hình chung. App thật nằm ở apps/,
#   thư viện nằm ở packages/. Nhờ vậy lint, script, CI áp dụng đồng nhất
#   cho mọi package, không có "package đặc biệt" nào nằm ở root.
# =============================================================================
name: flutter_monorepo_sample
description: Monorepo mẫu Flutter theo chuẩn team lớn (Bloc + Clean Architecture).
publish_to: none

environment:
  # Pub Workspaces yêu cầu tối thiểu Dart 3.6. Ta dùng 3.13 vì
  # very_good_analysis và freezed bản hiện tại đều yêu cầu Dart 3.13.
  sdk: ^3.13.0

# -----------------------------------------------------------------------------
# Danh sách thành viên workspace.
#
# Tại sao liệt kê tường minh thay vì dùng glob (vd: `packages/*`)?
#   Dart 3.11+ có hỗ trợ glob, nhưng liệt kê từng package giúp:
#   - Người mới nhìn vào là thấy ngay repo có những package nào.
#   - Thêm package mới bắt buộc phải sửa file này -> PR đó sẽ được
#     review kỹ hơn (thêm package = thay đổi kiến trúc).
#
# Thứ tự dưới đây đi từ tầng thấp (lõi) lên tầng cao (app) cho dễ đọc,
# Dart không quan tâm thứ tự.
# -----------------------------------------------------------------------------
workspace:
  # Tầng 1: lõi, Dart thuần
  - packages/shared_domain
  # Tầng 2: nền tảng dùng chung
  - packages/core
  - packages/design_system
  - packages/l10n
  # Tầng 3: tính năng (KHÔNG được phụ thuộc lẫn nhau)
  - packages/features/feature_auth
  - packages/features/feature_product
  - packages/features/feature_settings
  # Tầng 4: ứng dụng
  - apps/main_app
  - apps/widgetbook_app
  # Công cụ nội bộ của repo (không thuộc app)
  - tools/arch_check

dev_dependencies:
  # Cần ở root để chạy `dart run build_runner build --workspace` (script
  # `gen`): build mọi package trong một lần chạy.
  build_runner: ^2.16.1
  # Khai báo melos ở đây để CẢ TEAM và CI dùng cùng một version melos.
  # Melos cài global sẽ tự chuyển sang version ghi trong file này.
  melos: ^8.10.0
  # Bộ lint nghiêm ngặt của Very Good Ventures, dùng chung toàn repo qua
  # analysis_options.yaml ở root.
  very_good_analysis: ^11.0.0

melos:
  # ---------------------------------------------------------------------------
  # Nhóm package theo tầng để có thể lọc, ví dụ:
  #   melos exec --category=features -- flutter test
  # `packages/*` không khớp `packages/features/feature_auth` vì `*` không đi
  # xuyên qua dấu `/`.
  # ---------------------------------------------------------------------------
  categories:
    apps:
      - apps/*
    features:
      - packages/features/*
    foundation:
      - packages/*
    tools:
      - tools/*

  command:
    bootstrap:
      # Đồng bộ ràng buộc SDK cho MỌI package mỗi lần chạy `melos bootstrap`.
      # Tại sao? Khi nâng Dart lên bản mới, chỉ cần sửa 1 chỗ ở đây thay vì
      # sửa 10 file pubspec.yaml (và không ai quên package nào).
      environment:
        sdk: ^3.13.0
      hooks:
        # Cài dependency xong thì tạo file .env từ file mẫu rồi sinh code.
        # Nhờ vậy người mới clone repo chỉ cần `melos bootstrap` là chạy được.
        post: melos run env:init && melos run gen

    run:
      # Script có `packageFilters` mặc định sẽ HỎI người dùng chọn package.
      # Trên CI không có ai trả lời -> treo. Tắt hỏi để luôn chạy mọi package
      # khớp bộ lọc (muốn giới hạn thì dùng --scope khi chạy).
      noSelect: true

  # ---------------------------------------------------------------------------
  # Script dùng chung. Chạy bằng `melos run <tên>` (hoặc `melos <tên>`).
  #
  # LƯU Ý QUAN TRỌNG: script trùng tên lệnh có sẵn của melos (analyze, test,
  # format, clean) sẽ GHI ĐÈ lệnh đó. Vì vậy bên trong script `test` tuyệt đối
  # không gọi `melos test` (sẽ tự gọi lại chính nó -> lặp vô hạn).
  # ---------------------------------------------------------------------------
  scripts:
    analyze:
      description: Phân tích tĩnh toàn repo (very_good_analysis) sau khi kiểm tra quy tắc kiến trúc.
      # Chạy `dart analyze` MỘT LẦN ở root thay vì từng package: với Pub
      # Workspaces, analyzer dùng chung một package_config nên phân tích cả
      # repo một lượt nhanh hơn nhiều so với khởi động analyzer 10 lần.
      run: dart analyze --fatal-infos .
      dependsOn:
        - check:arch

    check:arch:
      description: Kiểm tra quy tắc phụ thuộc giữa các package và độ "sạch" của domain layer.
      # Gọi `dart <file>` thay vì `dart run <file>`: `dart run` chạy thêm
      # build hook native của các plugin (vd: objective_c) trước khi chạy
      # script. Script chỉ dùng dart:io nên không cần bước đó, gọi thẳng nhanh
      # hơn và không in "Running build hooks..." ra stderr.
      run: dart tools/arch_check/bin/arch_check.dart

    test:
      description: Chạy unit/widget test của mọi package có thư mục test/.
      # Script chỉ gồm `dependsOn` = một "nhóm" script. Tách đôi vì package
      # Dart thuần phải chạy bằng `dart test`, package Flutter bằng `flutter test`.
      dependsOn:
        - test:dart
        - test:flutter

    test:dart:
      private: true
      exec:
        command: dart test
        failFast: true
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      private: true
      exec:
        # --no-pub: bỏ bước `pub get` mà flutter test tự chạy mỗi lần, vì
        # `melos bootstrap` đã resolve cho cả workspace rồi -> nhanh hơn.
        command: flutter test --no-pub
        # Mỗi lệnh `flutter test` đã tự chạy song song các file test bên trong.
        # Chạy thêm nhiều package song song dễ làm máy CI hết RAM.
        concurrency: 1
        failFast: true
      packageFilters:
        flutter: true
        dirExists: test

    # Vì sao không dùng `dart format .`? Lệnh đó format cả code SINH RA
    # (*.g.dart, *.freezed.dart...). Các file này nằm trong .gitignore, không
    # ai sửa tay, và build_runner không bảo đảm format giống cấu hình repo,
    # nên `format:check` có thể fail oan ngay sau `melos run gen`.
    #
    # `git ls-files --cached --others --exclude-standard` liệt kê file đã
    # được git theo dõi CỘNG file mới chưa commit, nhưng BỎ file bị
    # .gitignore. Nhờ vậy chỉ format code do người viết.
    format:
      description: Format code Dart do người viết (bỏ qua code sinh ra).
      run: dart format $(git ls-files --cached --others --exclude-standard '*.dart')

    format:check:
      description: Kiểm tra format, có file chưa format thì fail (dùng trong CI).
      run: dart format --output=none --set-exit-if-changed $(git ls-files --cached --others --exclude-standard '*.dart')

    gen:
      description: Sinh code (injectable, envied, freezed, json, retrofit, drift, slang...) cho toàn workspace.
      # `--workspace`: build_runner build MỌI package trong MỘT tiến trình và
      # tự sắp thứ tự giữa các package (vd: core sinh CorePackageModule xong
      # thì main_app mới dùng được). Nhanh hơn hẳn việc chạy từng package
      # bằng `melos exec`, vì analyzer chỉ khởi động một lần cho cả repo.
      run: dart run build_runner build --workspace

    gen:watch:
      description: Như `gen` nhưng chạy liên tục, tự sinh lại khi sửa code.
      run: dart run build_runner watch --workspace
      # Cần terminal thật để bấm Ctrl+C dừng watch.
      stdio: inherit

    env:init:
      description: Tạo file .env của từng flavor từ file mẫu (*.example) nếu chưa có.
      # Gọi thẳng `dart <file>` vì cùng lý do với script `check:arch`.
      run: dart apps/main_app/tool/init_env.dart

    clean:
      description: Xoá build/ và .dart_tool/ của mọi package. Sau đó chạy lại `melos bootstrap`.
      dependsOn:
        - clean:flutter
        - clean:dart

    clean:flutter:
      private: true
      exec: flutter clean
      packageFilters:
        flutter: true

    clean:dart:
      private: true
      # Package Dart thuần không dùng được `flutter clean`.
      # (Lệnh rm chỉ chạy trên macOS/Linux; team dùng Windows cần đổi lại.)
      exec: rm -rf build .dart_tool coverage
      packageFilters:
        flutter: false
