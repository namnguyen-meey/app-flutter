# Tầng 2 (nền tảng) - hạ tầng kỹ thuật dùng chung: network, storage, logger,
# config/flavor, DI nền. Không chứa nghiệp vụ, không biết feature nào tồn tại.
name: core
description: Hạ tầng dùng chung - network (dio), storage, logger, config/flavor, DI nền.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  # core phụ thuộc shared_domain (KHÔNG có chiều ngược lại) để map lỗi
  # hạ tầng (DioException...) thành Failure của domain.
  flutter_secure_storage: ^11.2.0
  fpdart: ^1.2.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  shared_domain: ^0.1.0
  shared_preferences: ^2.5.6
  talker: ^5.2.0
  talker_dio_logger: ^5.2.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
